<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Loewe Remote</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            min-height: 100%;
            max-height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #0a0a0c;
            color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            -webkit-touch-callout: none;
        }

        body {
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
            padding: 8px;
        }

        /* Remote Chassis: Apple TV Siri Remote Aluminum Unibody styling */
        .remote-frame {
            width: 100%;
            max-width: 360px;
            max-height: 98vh;
            background: #17181c;
            background: linear-gradient(180deg, #1f2025 0%, #151619 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 16px 18px 18px 18px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-align-items: center;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 2;
        }

        /* Top Header: Brand & Status Pill */
        .header {
            width: 100%;
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            padding: 0 6px;
        }

        .brand-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #86868b;
            text-transform: uppercase;
        }

        .status-pill {
            display: -webkit-inline-flex;
            display: inline-flex;
            -webkit-align-items: center;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #86868b;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #86868b;
        }

        .status-pill.online {
            background: rgba(48, 209, 88, 0.12);
            color: #30d158;
        }
        .status-pill.online .status-dot {
            background: #30d158;
            box-shadow: 0 0 8px #30d158;
        }

        .status-pill.standby {
            background: rgba(255, 69, 58, 0.12);
            color: #ff453a;
        }
        .status-pill.standby .status-dot {
            background: #ff453a;
        }

        /* Upper Section: Siri Remote Clickpad / Touch Surface */
        .clickpad-wrapper {
            position: relative;
            width: 210px;
            height: 210px;
            margin: 0;
            flex-shrink: 0;
        }

        .touchpad {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            background: #222329;
            background: radial-gradient(circle at 50% 35%, #2a2b32 0%, #1e1f24 100%);
            border: 2px solid #33343d;
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.6), 0 6px 18px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            touch-action: none;
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
            overflow: hidden;
            transition: border-color 0.15s, background-color 0.15s, transform 0.1s;
        }

        .touchpad:active, .touchpad.active {
            border-color: #555765;
            -webkit-transform: scale(0.985);
            transform: scale(0.985);
        }

        /* Directional Indicators on the Clickpad Ring */
        .arrow-hint {
            position: absolute;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            font-weight: 800;
            pointer-events: none;
            transition: color 0.15s, transform 0.15s;
        }
        .arrow-hint.hint-up    { top: 8px; }
        .arrow-hint.hint-down  { bottom: 8px; }
        .arrow-hint.hint-left  { left: 10px; }
        .arrow-hint.hint-right { right: 10px; }

        .arrow-hint.active {
            color: #60a5fa;
            -webkit-transform: scale(1.4);
            transform: scale(1.4);
        }

        /* Inner Center OK Disc */
        .center-button {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: #222329;
            background: linear-gradient(145deg, #282930, #1c1d22);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s, background 0.15s;
            z-index: 5;
            pointer-events: auto; /* Dedicated clickable button */
        }

        .center-label {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #ffffff;
            pointer-events: none;
        }

        .center-sublabel {
            font-size: 0.55rem;
            color: #86868b;
            letter-spacing: 0.5px;
            margin-top: 1px;
            text-transform: uppercase;
            pointer-events: none;
        }

        .center-button:active, .center-button.pressed {
            -webkit-transform: scale(0.92);
            transform: scale(0.92);
            background: #353640;
            border-color: #60a5fa;
        }

        /* Lower Section: 2-Column Physical Style Buttons (Flexbox for 100% BB10 compatibility) */
        .keypad-grid {
            width: 100%;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-wrap: wrap;
            flex-wrap: wrap;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            padding: 0 2px;
        }

        .remote-btn {
            width: 48%;
            margin-bottom: 10px;
            appearance: none;
            -webkit-appearance: none;
            background: #23242a;
            color: #f5f5f7;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 13px 8px;
            font-size: 0.9rem;
            font-weight: 600;
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            transition: background 0.12s, transform 0.08s;
            touch-action: manipulation;
        }

        .remote-btn:active, .remote-btn.pressed {
            background: #3a3b45;
            -webkit-transform: scale(0.95);
            transform: scale(0.95);
        }

        .remote-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* Accent & Power Key Variations */
        .remote-btn.btn-home {
            color: #ffffff;
        }

        .remote-btn.btn-standby {
            color: #ffb4ab;
        }
        .remote-btn.btn-standby:active, .remote-btn.btn-standby.pressed {
            background: #4a1515;
            color: #ffffff;
        }

        .remote-btn.btn-wake {
            color: #72f29b;
        }
        .remote-btn.btn-wake:active, .remote-btn.btn-wake.pressed {
            background: #144026;
            color: #ffffff;
        }

        /* Volume Rocker Group */
        .vol-rocker {
            width: 48%;
            display: -webkit-flex;
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
        }

        .vol-rocker .remote-btn {
            width: 48%;
            margin-bottom: 0;
            padding: 13px 4px;
        }

        /* Passport Capacitive Keyboard Banner */
        .keyboard-hint {
            font-size: 0.72rem;
            color: #86868b;
            text-align: center;
            line-height: 1.35;
            padding: 0 4px;
        }

        .keyboard-hint .badge-passport {
            color: #60a5fa;
            font-weight: 600;
        }

        .keyboard-hint kbd {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 1px 4px;
            font-family: monospace;
            font-size: 0.72rem;
            color: #d1d1d6;
        }

        /* Responsive Compact adaptation for 1440x1440 Passport square */
        @media (max-height: 700px), (max-width: 380px) {
            body { padding: 4px; }
            .remote-frame {
                padding: 12px 14px 14px 14px;
                gap: 8px;
                max-width: 340px;
                border-radius: 32px;
            }
            .clickpad-wrapper {
                width: 180px;
                height: 180px;
            }
            .center-button {
                width: 70px;
                height: 70px;
            }
            .remote-btn {
                padding: 11px 6px;
                font-size: 0.85rem;
                margin-bottom: 8px;
                border-radius: 14px;
            }
            .vol-rocker {
                margin-bottom: 8px;
            }
            .vol-rocker .remote-btn {
                padding: 11px 2px;
            }
        }
    </style>
</head>
<body>
    <main class="remote-frame" role="region" aria-label="Loewe Apple TV Style Remote">
        <!-- Top Status Bar -->
        <header class="header">
            <span class="brand-title">LOEWE</span>
            <div id="status-badge" class="status-pill" aria-live="polite">
                <span class="status-dot"></span>
                <span id="status-text">CONNECTING</span>
            </div>
        </header>

        <!-- Siri Remote Gesture Touchpad / Clickpad -->
        <section class="clickpad-wrapper" aria-label="Touch Navigation Area">
            <div id="touchpad" class="touchpad" role="region" aria-label="Navigation Touchpad">
                <span id="hint-up" class="arrow-hint hint-up">&#9650;</span>
                <span id="hint-down" class="arrow-hint hint-down">&#9660;</span>
                <span id="hint-left" class="arrow-hint hint-left">&#9664;</span>
                <span id="hint-right" class="arrow-hint hint-right">&#9654;</span>

                <!-- Center OK Button (Strictly isolated tap target) -->
                <div id="center-disc" class="center-button" role="button" aria-label="OK Confirm">
                    <span class="center-label">OK</span>
                    <span class="center-sublabel">PRESS</span>
                </div>
            </div>
        </section>

        <!-- Lower Minimal Keypad (Golden Button Set) -->
        <section class="keypad-grid" aria-label="Remote Control Buttons">
            <!-- Row 1: Back (<) & Home (Sources / Home Menu) -->
            <button class="remote-btn" onclick="sendAction('key', '65', 'l2700')" title="Back / Return" aria-label="Back">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                <span>BACK</span>
            </button>

            <button class="remote-btn btn-home" onclick="sendAction('key', '126', 'l2700')" title="Home / Sources Menu" aria-label="Home">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>HOME</span>
            </button>

            <!-- Row 2: Play/Pause & Menu -->
            <button class="remote-btn" onclick="sendAction('key', '53', 'l2700-hdr')" title="Play / Pause" aria-label="Play / Pause">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z M14.5 19h2V5h-2v14z"/></svg>
                <span>PLAY</span>
            </button>

            <button class="remote-btn" onclick="sendAction('key', '11', 'l2700')" title="Menu Settings" aria-label="Menu">
                <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                <span>MENU</span>
            </button>

            <!-- Row 3: Volume Controls -->
            <div class="vol-rocker">
                <button class="remote-btn" onclick="sendAction('key', '20', 'l2700')" title="Volume Down" aria-label="Volume Down">
                    <svg viewBox="0 0 24 24"><path d="M7 9v6h4l5 5V4l-5 5H7z"/></svg>
                    <span>-</span>
                </button>
                <button class="remote-btn" onclick="sendAction('key', '21', 'l2700')" title="Volume Up" aria-label="Volume Up">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                    <span>+</span>
                </button>
            </div>

            <button class="remote-btn" onclick="sendAction('key', '13', 'l2700')" title="Mute Audio" aria-label="Mute Audio">
                <svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                <span>MUTE</span>
            </button>

            <!-- Row 4: Power Controls (Wake / Standby) -->
            <button class="remote-btn btn-wake" onclick="sendAction('wake')" title="Wake-on-LAN" aria-label="Wake TV">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
                <span>WAKE</span>
            </button>

            <button class="remote-btn btn-standby" onclick="sendAction('key', '12', 'l2700')" title="Soft Standby" aria-label="Standby TV">
                <svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A7.92 7.92 0 0 1 20 12c0 4.42-3.58 8-8 8s-8-3.58-8-8c0-2.47 1.12-4.67 2.89-6.14l-1.42-1.42C3.21 6.39 2 9.05 2 12c0 5.52 4.48 10 10 10s10-4.48 10-10c0-2.95-1.21-5.61-3.17-7.83z"/></svg>
                <span>STANDBY</span>
            </button>
        </section>

        <!-- Physical Keyboard Shortcuts Hint -->
        <footer class="keyboard-hint">
            <span class="badge-passport">Passport:</span> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> D-Pad &bull; <kbd>Enter</kbd> OK &bull; <kbd>Space</kbd> Home &bull; <kbd>B</kbd> Back &bull; <kbd>P</kbd> Play
        </footer>
    </main>

    <script>
        // ES5 Pure JavaScript - 100% compatible with BB10 WebKit and modern smartphones
        var tvOnline = false;

        // Visual flash indicator helper for Touchpad hints
        function flashDirection(dir) {
            var el = document.getElementById('hint-' + dir);
            if (el) {
                el.className = 'arrow-hint hint-' + dir + ' active';
                setTimeout(function() {
                    el.className = 'arrow-hint hint-' + dir;
                }, 220);
            }
        }

        // Trigger native device haptic vibration if supported
        function hapticFeedback(pattern) {
            try {
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(pattern || 15);
                }
            } catch (e) {}
        }

        // Generic XHR caller (ES5 compliant)
        function apiRequest(method, url, callback) {
            var xhr = new XMLHttpRequest();
            xhr.open(method, url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (callback) {
                        callback(xhr.status === 200, xhr.responseText);
                    }
                }
            };
            xhr.send();
        }

        // Send remote button action
        function sendAction(action, code, alphabet) {
            hapticFeedback(20);
            var url = '/api/' + action;
            if (code) {
                url += '?code=' + encodeURIComponent(code);
                if (alphabet) {
                    url += '&alphabet=' + encodeURIComponent(alphabet);
                }
            }
            apiRequest('POST', url, function(ok) {
                setTimeout(fetchStatus, 1500);
            });
        }

        // Update TV Status Indicator
        function fetchStatus() {
            apiRequest('GET', '/api/status', function(ok, resp) {
                var badge = document.getElementById('status-badge');
                var text = document.getElementById('status-text');
                if (ok) {
                    try {
                        var data = JSON.parse(resp);
                        if (data.status === 'on') {
                            tvOnline = true;
                            badge.className = 'status-pill online';
                            text.textContent = 'ONLINE';
                            return;
                        }
                    } catch (e) {}
                }
                tvOnline = false;
                badge.className = 'status-pill standby';
                text.textContent = 'STANDBY';
            });
        }

        // 1. ISOLATED CENTER OK BUTTON (Explicit Click Only)
        // Never triggers accidentally on swipes or keydown!
        (function initCenterOkButton() {
            var disc = document.getElementById('center-disc');
            if (!disc) return;

            function triggerOk(e) {
                if (e && e.stopPropagation) e.stopPropagation();
                if (e && e.preventDefault) e.preventDefault();
                disc.className = 'center-button pressed';
                setTimeout(function() { disc.className = 'center-button'; }, 180);
                sendAction('key', '38', 'l2700'); // OK Confirm
            }

            disc.addEventListener('click', triggerOk, false);
            disc.addEventListener('touchend', triggerOk, false);
        })();

        // 2. TOUCHPAD GESTURES (Strictly Swipe Only - NEVER Fires OK)
        (function initTouchpad() {
            var pad = document.getElementById('touchpad');
            var startX = 0, startY = 0;
            var isTracking = false;
            var SWIPE_THRESHOLD = 26; // pixels

            function handleStart(x, y, target) {
                // If touching the center disc, let center disc handler take care of OK
                if (target && (target.id === 'center-disc' || target.parentElement.id === 'center-disc')) {
                    return;
                }
                isTracking = true;
                startX = x;
                startY = y;
                pad.className = 'touchpad active';
            }

            function handleMove(x, y, evt) {
                if (!isTracking) return;
                var dx = x - startX;
                var dy = y - startY;

                if (Math.abs(dx) > SWIPE_THRESHOLD || Math.abs(dy) > SWIPE_THRESHOLD) {
                    isTracking = false; // Only fire once per swipe stroke!
                    if (evt && evt.preventDefault) evt.preventDefault();

                    if (Math.abs(dx) > Math.abs(dy)) {
                        if (dx > 0) {
                            flashDirection('right');
                            sendAction('key', '16', 'l2700'); // Right
                        } else {
                            flashDirection('left');
                            sendAction('key', '17', 'l2700'); // Left
                        }
                    } else {
                        if (dy > 0) {
                            flashDirection('down');
                            sendAction('key', '33', 'l2700'); // Down
                        } else {
                            flashDirection('up');
                            sendAction('key', '32', 'l2700'); // Up
                        }
                    }
                }
            }

            function handleEnd() {
                isTracking = false;
                pad.className = 'touchpad';
                // CRITICAL FIX: NO TAP TO OK HERE! Swiping area NEVER triggers OK!
            }

            // Touch events
            pad.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1) {
                    handleStart(e.touches[0].clientX, e.touches[0].clientY, e.target);
                }
            }, false);

            pad.addEventListener('touchmove', function(e) {
                if (e.touches.length === 1) {
                    handleMove(e.touches[0].clientX, e.touches[0].clientY, e);
                }
            }, false);

            pad.addEventListener('touchend', handleEnd, false);
            pad.addEventListener('touchcancel', handleEnd, false);

            // Mouse fallback for desktop testing
            pad.addEventListener('mousedown', function(e) {
                handleStart(e.clientX, e.clientY, e.target);
            });
            window.addEventListener('mousemove', function(e) {
                handleMove(e.clientX, e.clientY, e);
            });
            window.addEventListener('mouseup', handleEnd);
        })();

        // 3. BLACKBERRY PASSPORT PHYSICAL KEYBOARD HANDLER
        // 100% Pure Discrete Navigation - Zero Accidental OK Injections!
        (function initKeyboardHandler() {
            function handleKeyDown(e) {
                var keyCode = e.keyCode || e.which;
                var key = (e.key ? e.key.toLowerCase() : String.fromCharCode(keyCode).toLowerCase());

                // 1. Navigation Keys: W/A/S/D or Arrow keys (ONLY Move Cursor, NEVER OK)
                if (key === 'w' || key === 'arrowup' || keyCode === 38 || keyCode === 87) {
                    flashDirection('up');
                    sendAction('key', '32', 'l2700'); // Up ONLY
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
                if (key === 's' || key === 'arrowdown' || keyCode === 40 || keyCode === 83) {
                    flashDirection('down');
                    sendAction('key', '33', 'l2700'); // Down ONLY
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
                if (key === 'a' || key === 'arrowleft' || keyCode === 37 || keyCode === 65) {
                    flashDirection('left');
                    sendAction('key', '17', 'l2700'); // Left ONLY
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
                if (key === 'd' || key === 'arrowright' || keyCode === 39 || keyCode === 68) {
                    flashDirection('right');
                    sendAction('key', '16', 'l2700'); // Right ONLY
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }

                // 2. OK Confirm: ONLY Enter Key (13)
                if (key === 'enter' || keyCode === 13) {
                    var disc = document.getElementById('center-disc');
                    disc.className = 'center-button pressed';
                    setTimeout(function() { disc.className = 'center-button'; }, 180);
                    sendAction('key', '38', 'l2700'); // OK Confirm
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }

                // 3. HOME (Sources Menu): Space bar (32) or 'I' (73, Info/Home)
                if (key === ' ' || key === 'space' || keyCode === 32 || key === 'i' || keyCode === 73) {
                    sendAction('key', '126', 'l2700'); // Home / Sources
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }

                // 4. BACK (Return): Backspace (8), Esc (27), or 'B' (66)
                if (key === 'backspace' || key === 'escape' || keyCode === 8 || keyCode === 27 || key === 'b' || keyCode === 66) {
                    sendAction('key', '65', 'l2700'); // Back
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }

                // 5. PLAY / PAUSE: 'P' (80)
                if (key === 'p' || keyCode === 80) {
                    sendAction('key', '53', 'l2700-hdr'); // Play / Pause
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }

                // 6. MENU: 'M' (77)
                if (key === 'm' || keyCode === 77) {
                    sendAction('key', '11', 'l2700'); // Menu
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }

                // 7. VOLUME: '+' / '-'
                if (key === '+' || key === '=' || keyCode === 187 || keyCode === 61) {
                    sendAction('key', '21', 'l2700'); // Vol +
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
                if (key === '-' || key === '_' || keyCode === 189 || keyCode === 173) {
                    sendAction('key', '20', 'l2700'); // Vol -
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
            }

            // Capture phase prioritizes custom handlers before browser default
            window.addEventListener('keydown', handleKeyDown, true);
            document.addEventListener('keydown', handleKeyDown, true);
        })();

        // Polling loop for TV online status (every 4 seconds)
        fetchStatus();
        setInterval(fetchStatus, 4000);
    </script>
</body>
